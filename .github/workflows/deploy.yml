name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # 手動実行も可能にしておく(初回セットアップ確認用)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを避ける(進行中のデプロイを中断はしない)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (GitHub Pagesのサブパス /hirameki/ 用)
        run: npm run build -w client
        env:
          HIRAMEKI_BASE: /hirameki/

      - name: Build Ippo (/hirameki/ippo/ に同居させる)
        run: |
          npm run build -w ippo
          cp -r ippo/dist client/dist/ippo
        env:
          IPPO_BASE: /hirameki/ippo/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
